# =========================
# Configurações Koyeb
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP otimizado para produção
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# CORS para produção (vamos ajustar depois com a URL do Netlify)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lovely-connie-maah2020-52e26217.koyeb.app}cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Porta para Koyeb
server.port=${PORT:8080}
server.servlet.context-path=/

# Thymeleaf (desativar cache em dev)
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=false

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.example.Dashboard=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN